name: CI

# Runs every test on each PR and each push to main. Branch protection on main requires the "tests" job.
# No Docker, no secrets: tests that need the private data key (savings/tests real days) skip themselves.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.20.0"   # >= 23.6 runs the .ts modules directly

      - name: Python dependencies (pinned)
        run: pip install --no-deps -r pipeline/requirements-ci.txt   # every transitive dependency is pinned there

      - name: Python tests (pipeline, pva)
        working-directory: pipeline
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider pva/tests tests

      - name: JS tests (Edge Function modules, access, mail worker, savings engine, dashboard)
        run: |
          node --test supabase/functions/_shared/tests/*.test.ts supabase/tests/*.test.mjs \
            cloudflare/mail-worker/worker.test.mjs savings/tests/*.test.js assets/tests/*.test.mjs
