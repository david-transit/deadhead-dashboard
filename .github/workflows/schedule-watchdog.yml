name: schedule-watchdog

# Monthly: checks that the scheduled workflows (nightly, keepalive, backup) are enabled and their last
# scheduled run succeeded recently. A disabled workflow (e.g. GitHub's 60-day inactivity rule) is re-enabled
# through the API. Any problem: one mail to support@yalla-sa.app through Resend (secret RESEND_API_KEY).
# Manual run with test_alert=true reports a fake problem, to test the mail.

on:
  schedule:
    - cron: "0 7 1 * *"   # 1st of the month, 09:00 Israel (winter)
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Report a fake problem to test the mail"
        type: boolean
        default: false

permissions:
  actions: write     # read runs, re-enable a disabled workflow
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check scheduled workflows
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TEST: ${{ inputs.test_alert && 'true' || 'false' }}
        run: |
          set -u
          now=$(date -u +%s); problems=""
          # workflow file | max age of the last scheduled run (days)
          for spec in "nightly.yml|2" "supabase-keepalive.yml|4" "backup-weekly.yml|8"; do
            wf=${spec%%|*}; max=${spec##*|}
            info=$(gh api "repos/$REPO/actions/workflows/$wf" -q '.state + " " + .created_at' 2>/dev/null) || { problems+="- $wf: לא נמצא\n"; continue; }
            state=${info%% *}; created=$(date -u -d "${info#* }" +%s)
            if [ "$state" != "active" ]; then
              if gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable" >/dev/null 2>&1; then
                problems+="- $wf: היה כבוי ($state) והופעל מחדש אוטומטית\n"
              else
                problems+="- $wf: כבוי ($state) ולא הצלחתי להפעיל מחדש\n"
              fi
            fi
            run=$(gh api "repos/$REPO/actions/workflows/$wf/runs?event=schedule&per_page=1" \
              -q '.workflow_runs[0] | select(.) | .created_at + " " + (.conclusion // "in_progress") + " " + .html_url')
            if [ -z "$run" ]; then
              # a workflow younger than its interval has no scheduled run yet
              [ $(( (now - created) / 86400 )) -ge "$max" ] && problems+="- $wf: אין אף ריצה מתוזמנת\n"
              echo "$wf: $state, no scheduled run yet"; continue
            fi
            read -r rt c url <<<"$run"; t=$(date -u -d "$rt" +%s); age=$(( (now - t) / 86400 ))
            echo "$wf: $state, last scheduled run $age days ago, $c"
            [ "$age" -gt "$max" ] && problems+="- $wf: הריצה המתוזמנת האחרונה לפני $age ימים (מותר עד $max)\n"
            case "$c" in success|in_progress) ;; *) problems+="- $wf: הריצה המתוזמנת האחרונה הסתיימה ב-$c: $url\n" ;; esac
          done
          [ "$TEST" = "true" ] && problems+="- [בדיקה] בעיה מדומה לבדיקת המייל\n"
          { echo "problems<<EOF"; printf "%b" "$problems"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          if [ -n "$problems" ]; then printf "%b" "$problems"; echo "::error::scheduled workflows need attention"; exit 1; fi
          echo "all scheduled workflows are enabled and ran successfully"

      - name: Alert mail (only when something is wrong)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
          TEST: ${{ inputs.test_alert && 'true' || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          [ -n "$RESEND_API_KEY" ] || { echo "::error::secret RESEND_API_KEY is missing, no alert sent"; exit 1; }
          prefix=""; [ "$TEST" = "true" ] && prefix="[בדיקה] "
          subject="${prefix}התראה: ריצות מתוזמנות של יאללה־סע דורשות בדיקה"
          text="${prefix}הבדיקה החודשית של הריצות המתוזמנות ב-deadhead-dashboard מצאה בעיה:
          ${PROBLEMS:-הבדיקה עצמה נכשלה, ראה את הריצה}
          הריצה ב-GitHub: ${RUN_URL}"
          payload=$(jq -n --arg s "$subject" --arg t "$text" \
            '{from:"יאללה־סע – התראות <support@yalla-sa.app>", to:["support@yalla-sa.app"], subject:$s, text:$t}')
          code=$(curl -sS -o res.json -w '%{http_code}' --max-time 60 -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d "$payload" || echo 000)
          echo "Resend: HTTP $code $(cat res.json 2>/dev/null)"
          [ "$code" = "200" ] || { echo "::error::alert mail was not accepted by Resend"; exit 1; }
