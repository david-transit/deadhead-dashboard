name: nightly-day

on:
  schedule:
    - cron: "0 3 * * *"   # 05:00 Israel in winter (IST), 06:00 in summer (IDT); service day D ends D+1 03:59
  workflow_dispatch:
    inputs:
      from:
        description: "First day YYYY-MM-DD (empty = yesterday, Israel time)"
        required: false
      to:
        description: "Last day YYYY-MM-DD (empty = same as from)"
        required: false
      force:
        description: "Rebuild days that already exist"
        type: boolean
        default: false
      operator:
        description: "Only this operator slug (empty = every active operator in pipeline/operators.json)"
        required: false
      seed_rev:
        description: "One-off move to Storage: upload the operator files as they were in git at this commit (then nothing is built)"
        required: false

permissions:
  contents: read   # default for every job; only "build" may push (security review L7)

concurrency:
  group: nightly-day
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ops: ${{ steps.ops.outputs.ops }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: ops
        env:
          ONLY: ${{ inputs.operator }}
        run: |
          set -eu
          ops=$(python3 -c 'import json,os
          only=os.environ.get("ONLY") or ""
          import re
          ops=[dict(slug=o["slug"],secret=o["key_secret"]) for o in json.load(open("pipeline/operators.json",encoding="utf-8"))["operators"]
               if o["active"] and (not only or o["slug"]==only)]
          assert all(re.fullmatch(r"[a-z0-9-]{2,40}",o["slug"]) and re.fullmatch(r"DATA_KEY[A-Z0-9_]*",o["secret"]) for o in ops), "bad operators.json"
          print(json.dumps(ops))')
          [ "$ops" != "[]" ] || { echo "no active operator matches"; exit 1; }
          echo "ops=$ops" >> "$GITHUB_OUTPUT"
          echo "operators: $ops"

  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        op: ${{ fromJSON(needs.plan.outputs.ops) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # main requires the CI check (ruleset); the nightly data commit is pushed with this deploy key, the ruleset's only bypass
          ssh-key: ${{ secrets.NIGHTLY_DEPLOY_KEY }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - run: pip install -r pipeline/requirements.txt

      - name: Restore caches (route ends, OSRM)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            pipeline/cache/route_ends.json
            pipeline/cache/osrm_cache.json
            pipeline/cache/line_refs.json
          key: deadhead-cache-${{ github.run_id }}-${{ matrix.op.slug }}
          restore-keys: deadhead-cache-

      # Operator data (encrypted day / ends / days files) lives in the private Storage bucket 'operator-data', not in the
      # repo. The runner keeps a local copy in the Actions cache and downloads only what is missing or changed.
      - name: Restore operator data copy
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/${{ matrix.op.slug }}/*.js
          key: opdata-${{ matrix.op.slug }}-${{ github.run_id }}
          restore-keys: opdata-${{ matrix.op.slug }}-

      - name: One-off move of the operator files to Storage
        if: inputs.seed_rev != ''
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLUG: ${{ matrix.op.slug }}
          REV: ${{ inputs.seed_rev }}
        run: |
          set -eu
          [[ "$REV" =~ ^[0-9a-f]{7,40}$ ]] || { echo "seed_rev must be a commit sha"; exit 1; }
          git fetch -q --depth=1 origin "$REV"
          python pipeline/storage_sync.py seed "$SLUG" "$REV"

      - name: Operator data from Storage
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLUG: ${{ matrix.op.slug }}
        run: python pipeline/storage_sync.py pull "$SLUG"

      - name: Pick days
        id: days
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          FORCE: ${{ inputs.force }}
          SLUG: ${{ matrix.op.slug }}
          SEED: ${{ inputs.seed_rev }}
        run: |
          set -eu
          if [ -n "${SEED:-}" ]; then echo "days=" >> "$GITHUB_OUTPUT"; echo "seed run: nothing to build"; exit 0; fi
          if [ -z "${FROM:-}" ]; then FROM=$(TZ=Asia/Jerusalem date -d yesterday +%F); fi
          if [ -z "${TO:-}" ]; then TO=$FROM; fi
          re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          [[ "$FROM" =~ $re && "$TO" =~ $re ]] || { echo "from/to must be YYYY-MM-DD"; exit 1; }
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "bad operator slug"; exit 1; }
          d=$FROM; list=""
          while [ "$(date -d "$d" +%s)" -le "$(date -d "$TO" +%s)" ]; do
            if [ -f "data/$SLUG/day_$d.js" ] && [ "${FORCE:-false}" != "true" ]; then echo "skip $d (already exists)"; else list="$list $d"; fi
            d=$(date -d "$d +1 day" +%F)
          done
          echo "days=$list" >> "$GITHUB_OUTPUT"
          echo "to build:$list"

      # Licensed route shapes of the operator from the MOT GTFS of each day built (pipeline/gtfs_shapes.py, README "קווי
      # הרישוי"): only the day's own file, from the Open Bus archive of the MOT GTFS (routes change from day to day; R48).
      # No fallback to today's MOT file: a day without its GTFS is marked "אין GTFS של היום" and not computed (next step).
      # ~140 MB each, to the runner's temp folder (outside the checkout), only the operator's shapes kept.
      - name: Line shapes from the MOT GTFS of each day
        if: steps.days.outputs.days != ''
        env:
          SLUG: ${{ matrix.op.slug }}
          DAYS: ${{ steps.days.outputs.days }}
        run: |
          set -eu
          t="$RUNNER_TEMP/gtfs-mot"; mkdir -p "$t" pipeline/cache
          for d in $DAYS; do
            y=${d:0:4}; m=${d:5:2}; dd=${d:8:2}
            out="pipeline/cache/gtfs_shapes_${SLUG}_$d.json"
            if [ -f "$out" ]; then echo "$d: GTFS of the day already in the cache"; continue; fi
            if curl -sSf -m 900 --retry 3 -o "$t/gtfs.zip" "https://openbus-stride-public.s3.eu-west-1.amazonaws.com/gtfs_archive/$y/$m/$dd/israel-public-transportation.zip"; then
              python -I pipeline/gtfs_shapes.py "$t/gtfs.zip" --op "$SLUG" --out "$out" || { rm -f "$out"; echo "::warning::$d: GTFS of the day unreadable - day not computed (אין GTFS של היום)"; }
            else
              echo "::warning::$d: no GTFS of the day in the Open Bus archive - day not computed (אין GTFS של היום)"
            fi
            rm -f "$t/gtfs.zip"
          done

      # Our own OSRM with the bus profile from transit-studio (pipeline/osrm/README.md): graph cached per extract week +
      # profile hash, rebuilt weekly; osrm-routed on 127.0.0.1:5000 for this job only.
      # OFF until David approves the bus-vs-car review: repository variable DEADHEAD_ROUTING=bus switches it on.
      - name: OSRM graph key
        id: osrmkey
        if: steps.days.outputs.days != '' && vars.DEADHEAD_ROUTING == 'bus'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore OSRM bus graph
        if: steps.days.outputs.days != '' && vars.DEADHEAD_ROUTING == 'bus'
        id: osrmcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/osrm/bus-strict
          key: osrm-bus-strict-v26.10.0-${{ steps.osrmkey.outputs.week }}-${{ hashFiles('pipeline/osrm/profiles/*.lua', 'pipeline/osrm/local/*') }}

      - name: Start OSRM (bus-strict)
        if: steps.days.outputs.days != '' && vars.DEADHEAD_ROUTING == 'bus'
        id: osrm
        run: bash pipeline/osrm/serve.sh ~/osrm/bus-strict deadhead-bus-strict 5000

      - name: Save OSRM bus graph
        if: steps.days.outputs.days != '' && vars.DEADHEAD_ROUTING == 'bus' && steps.osrm.outputs.osrm == 'ok' && steps.osrmcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/osrm/bus-strict
          key: osrm-bus-strict-v26.10.0-${{ steps.osrmkey.outputs.week }}-${{ hashFiles('pipeline/osrm/profiles/*.lua', 'pipeline/osrm/local/*') }}

      - name: Build and encrypt
        if: steps.days.outputs.days != ''
        env:
          DATA_KEY: ${{ secrets[matrix.op.secret] }}
          SLUG: ${{ matrix.op.slug }}
          DAYS: ${{ steps.days.outputs.days }}
          SECRET_NAME: ${{ matrix.op.secret }}
          PYTHONIOENCODING: utf-8
          # bus (DEADHEAD_ROUTING=bus): our server, down = each new leg falls back to the public car server, marked fb
          OSRM_BASE: ${{ vars.DEADHEAD_ROUTING == 'bus' && 'http://127.0.0.1:5000' || '' }}
          OSRM_PROFILE: bus-strict
          OSRM_DOWN: ${{ steps.osrm.outputs.osrm != 'ok' }}
        run: |
          set -eu
          [ -n "$DATA_KEY" ] || { echo "secret $SECRET_NAME is missing"; exit 1; }
          export DATA_KEY_FILE="$RUNNER_TEMP/data_key"
          (umask 077; printf '%s' "$DATA_KEY" > "$DATA_KEY_FILE")
          for d in $DAYS; do
            echo "== $d"
            if [ ! -f "pipeline/cache/gtfs_shapes_${SLUG}_$d.json" ]; then  # R48: no GTFS of the day = not computed, marked
              python pipeline/build_day.py "$d" --op "$SLUG" --no-gtfs; continue
            fi
            timeout 110m python pipeline/build_day.py "$d" --op "$SLUG"  # first run after the route check (v3) re-routes the whole cache
          done
          rm -f "$DATA_KEY_FILE"

      - name: Remove plaintext day files
        if: always()
        run: rm -f data/*/day_*.json data/*/ends_*.json

      - name: Upload to Storage, write the public hash list
        if: steps.days.outputs.days != ''
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLUG: ${{ matrix.op.slug }}
        run: |
          set -eu
          python pipeline/storage_sync.py push "$SLUG"
          python pipeline/storage_sync.py manifest "$SLUG"

      - name: Save operator data copy
        if: always() && steps.days.outputs.days != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/${{ matrix.op.slug }}/*.js
          key: opdata-${{ matrix.op.slug }}-${{ github.run_id }}

      - name: Save caches
        if: always() && steps.days.outputs.days != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pipeline/cache/route_ends.json
            pipeline/cache/osrm_cache.json
            pipeline/cache/line_refs.json
          key: deadhead-cache-${{ github.run_id }}-${{ matrix.op.slug }}

      - name: Commit encrypted files
        if: steps.days.outputs.days != ''
        env:
          SLUG: ${{ matrix.op.slug }}
          DAYS: ${{ steps.days.outputs.days }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # only the public hash list (pva.seal reads it); the operator files themselves are in Storage
          git add "data/$SLUG/hashes.json"
          f="data/$SLUG/nogtfs.json"  # days without their own GTFS (dates only); removed when the last one gets built
          if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git add -A -- "$f"; fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Day hashes $SLUG:$DAYS"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
