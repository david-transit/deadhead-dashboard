name: nightly-day

on:
  schedule:
    - cron: "0 3 * * *"   # 05:00 Israel in winter (IST), 06:00 in summer (IDT); service day D ends D+1 03:59
  workflow_dispatch:
    inputs:
      from:
        description: "First day YYYY-MM-DD (empty = yesterday, Israel time)"
        required: false
      to:
        description: "Last day YYYY-MM-DD (empty = same as from)"
        required: false
      force:
        description: "Rebuild days that already exist"
        type: boolean
        default: false
      operator:
        description: "Only this operator slug (empty = every active operator in pipeline/operators.json)"
        required: false

permissions:
  contents: read   # default for every job; only "build" may push (security review L7)

concurrency:
  group: nightly-day
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ops: ${{ steps.ops.outputs.ops }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ops
        env:
          ONLY: ${{ inputs.operator }}
        run: |
          set -eu
          ops=$(python3 -c 'import json,os
          only=os.environ.get("ONLY") or ""
          import re
          ops=[dict(slug=o["slug"],secret=o["key_secret"]) for o in json.load(open("pipeline/operators.json",encoding="utf-8"))["operators"]
               if o["active"] and (not only or o["slug"]==only)]
          assert all(re.fullmatch(r"[a-z0-9-]{2,40}",o["slug"]) and re.fullmatch(r"DATA_KEY[A-Z0-9_]*",o["secret"]) for o in ops), "bad operators.json"
          print(json.dumps(ops))')
          [ "$ops" != "[]" ] || { echo "no active operator matches"; exit 1; }
          echo "ops=$ops" >> "$GITHUB_OUTPUT"
          echo "operators: $ops"

  build:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        op: ${{ fromJSON(needs.plan.outputs.ops) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - run: pip install -r pipeline/requirements.txt

      - name: Restore caches (route ends, OSRM)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            pipeline/cache/route_ends.json
            pipeline/cache/osrm_cache.json
            pipeline/cache/line_refs.json
          key: deadhead-cache-${{ github.run_id }}-${{ matrix.op.slug }}
          restore-keys: deadhead-cache-

      - name: Pick days
        id: days
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          FORCE: ${{ inputs.force }}
          SLUG: ${{ matrix.op.slug }}
        run: |
          set -eu
          if [ -z "${FROM:-}" ]; then FROM=$(TZ=Asia/Jerusalem date -d yesterday +%F); fi
          if [ -z "${TO:-}" ]; then TO=$FROM; fi
          re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          [[ "$FROM" =~ $re && "$TO" =~ $re ]] || { echo "from/to must be YYYY-MM-DD"; exit 1; }
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "bad operator slug"; exit 1; }
          d=$FROM; list=""
          while [ "$(date -d "$d" +%s)" -le "$(date -d "$TO" +%s)" ]; do
            if [ -f "data/$SLUG/day_$d.js" ] && [ "${FORCE:-false}" != "true" ]; then echo "skip $d (already exists)"; else list="$list $d"; fi
            d=$(date -d "$d +1 day" +%F)
          done
          echo "days=$list" >> "$GITHUB_OUTPUT"
          echo "to build:$list"

      # Licensed route shapes of the operator from the MOT GTFS of each day built (pipeline/gtfs_shapes.py, README "קווי
      # הרישוי"): the day's file from the Open Bus archive of the MOT GTFS (routes change from day to day), else today's MOT
      # file; ~140 MB each, to the runner's temp folder (outside the checkout), only the operator's shapes kept.
      - name: Line shapes from the MOT GTFS of each day
        if: steps.days.outputs.days != ''
        env:
          SLUG: ${{ matrix.op.slug }}
          DAYS: ${{ steps.days.outputs.days }}
        run: |
          set -eu
          t="$RUNNER_TEMP/gtfs-mot"; mkdir -p "$t" pipeline/cache
          for d in $DAYS; do
            y=${d:0:4}; m=${d:5:2}; dd=${d:8:2}
            if curl -sSf -m 900 --retry 3 -o "$t/gtfs.zip" "https://openbus-stride-public.s3.eu-west-1.amazonaws.com/gtfs_archive/$y/$m/$dd/israel-public-transportation.zip"                || curl -sSf -m 900 --retry 3 -A "Mozilla/5.0" -o "$t/gtfs.zip" https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip; then
              python -I pipeline/gtfs_shapes.py "$t/gtfs.zip" --op "$SLUG" --out "pipeline/cache/gtfs_shapes_${SLUG}_$d.json" || echo "::warning::GTFS shapes failed for $d"
            else
              echo "::warning::no GTFS for $d: empty legs from a GPS point use OSRM between stops, no route-deviation check"
            fi
            rm -f "$t/gtfs.zip"
          done

      # Our own OSRM with the bus profile from transit-studio (pipeline/osrm/README.md): graph cached per extract week +
      # profile hash, rebuilt weekly; osrm-routed on 127.0.0.1:5000 for this job only.
      # OFF until David approves the bus-vs-car review: repository variable DEADHEAD_ROUTING=bus switches it on.
      - name: OSRM graph key
        id: osrmkey
        if: steps.days.outputs.days != '' && vars.DEADHEAD_ROUTING == 'bus'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore OSRM bus graph
        if: steps.days.outputs.days != '' && vars.DEADHEAD_ROUTING == 'bus'
        id: osrmcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/osrm/bus-strict
          key: osrm-bus-strict-v26.10.0-${{ steps.osrmkey.outputs.week }}-${{ hashFiles('pipeline/osrm/profiles/*.lua', 'pipeline/osrm/local/*') }}

      - name: Start OSRM (bus-strict)
        if: steps.days.outputs.days != '' && vars.DEADHEAD_ROUTING == 'bus'
        id: osrm
        run: bash pipeline/osrm/serve.sh ~/osrm/bus-strict deadhead-bus-strict 5000

      - name: Save OSRM bus graph
        if: steps.days.outputs.days != '' && vars.DEADHEAD_ROUTING == 'bus' && steps.osrm.outputs.osrm == 'ok' && steps.osrmcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/osrm/bus-strict
          key: osrm-bus-strict-v26.10.0-${{ steps.osrmkey.outputs.week }}-${{ hashFiles('pipeline/osrm/profiles/*.lua', 'pipeline/osrm/local/*') }}

      - name: Build and encrypt
        if: steps.days.outputs.days != ''
        env:
          DATA_KEY: ${{ secrets[matrix.op.secret] }}
          SLUG: ${{ matrix.op.slug }}
          DAYS: ${{ steps.days.outputs.days }}
          SECRET_NAME: ${{ matrix.op.secret }}
          PYTHONIOENCODING: utf-8
          # bus (DEADHEAD_ROUTING=bus): our server, down = each new leg falls back to the public car server, marked fb
          OSRM_BASE: ${{ vars.DEADHEAD_ROUTING == 'bus' && 'http://127.0.0.1:5000' || '' }}
          OSRM_PROFILE: bus-strict
          OSRM_DOWN: ${{ steps.osrm.outputs.osrm != 'ok' }}
        run: |
          set -eu
          [ -n "$DATA_KEY" ] || { echo "secret $SECRET_NAME is missing"; exit 1; }
          export DATA_KEY_FILE="$RUNNER_TEMP/data_key"
          (umask 077; printf '%s' "$DATA_KEY" > "$DATA_KEY_FILE")
          for d in $DAYS; do
            echo "== $d"
            timeout 110m python pipeline/build_day.py "$d" --op "$SLUG"  # first run after the route check (v3) re-routes the whole cache
          done
          rm -f "$DATA_KEY_FILE" data/*/day_*.json data/*/ends_*.json

      - name: Save caches
        if: always() && steps.days.outputs.days != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            pipeline/cache/route_ends.json
            pipeline/cache/osrm_cache.json
            pipeline/cache/line_refs.json
          key: deadhead-cache-${{ github.run_id }}-${{ matrix.op.slug }}

      - name: Commit encrypted files
        if: steps.days.outputs.days != ''
        env:
          SLUG: ${{ matrix.op.slug }}
          DAYS: ${{ steps.days.outputs.days }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*/day_*.js data/*/days.js data/*/ends_*.js
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Add day(s) $SLUG:$DAYS"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
