name: nightly-day

on:
  schedule:
    - cron: "30 1 * * *"   # 03:30 Israel in winter (IST), 04:30 in summer (IDT)
  workflow_dispatch:
    inputs:
      from:
        description: "First day YYYY-MM-DD (empty = yesterday, Israel time)"
        required: false
      to:
        description: "Last day YYYY-MM-DD (empty = same as from)"
        required: false

permissions:
  contents: write

concurrency:
  group: nightly-day
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install -r pipeline/requirements.txt

      - name: Restore caches (route ends, OSRM)
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/cache/route_ends.json
            pipeline/cache/osrm_cache.json
          key: deadhead-cache-${{ github.run_id }}
          restore-keys: deadhead-cache-

      - name: Pick days
        id: days
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          set -eu
          if [ -z "${FROM:-}" ]; then FROM=$(TZ=Asia/Jerusalem date -d yesterday +%F); fi
          if [ -z "${TO:-}" ]; then TO=$FROM; fi
          d=$FROM; list=""
          while [ "$(date -d "$d" +%s)" -le "$(date -d "$TO" +%s)" ]; do
            if [ -f "data/day_$d.js" ]; then echo "skip $d (already exists)"; else list="$list $d"; fi
            d=$(date -d "$d +1 day" +%F)
          done
          echo "days=$list" >> "$GITHUB_OUTPUT"
          echo "to build:$list"

      - name: Build and encrypt
        if: steps.days.outputs.days != ''
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DAYS: ${{ steps.days.outputs.days }}
          PYTHONIOENCODING: utf-8
        run: |
          set -eu
          [ -n "$DATA_KEY" ] || { echo "secret DATA_KEY is missing"; exit 1; }
          export DATA_KEY_FILE="$RUNNER_TEMP/data_key"
          (umask 077; printf '%s' "$DATA_KEY" > "$DATA_KEY_FILE")
          for d in $DAYS; do
            echo "== $d"
            timeout 50m python pipeline/build_day.py "$d"
          done
          rm -f "$DATA_KEY_FILE" data/day_*.json

      - name: Save caches
        if: always() && steps.days.outputs.days != ''
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/cache/route_ends.json
            pipeline/cache/osrm_cache.json
          key: deadhead-cache-${{ github.run_id }}

      - name: Commit encrypted files
        if: steps.days.outputs.days != ''
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/day_*.js data/days.js
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Add day(s):${{ steps.days.outputs.days }}"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
