name: supabase-keepalive

# Keeps the Free-plan Supabase project (deadhead-dashboard) from being paused for inactivity.
# Supabase pauses Free projects with too little *user database activity* over 7 days
# (https://supabase.com/docs/guides/platform/free-project-pausing), so this runs a real query:
# the public keepalive() RPC through the REST API (a real SQL query, returns true, no side effects).
# Runs outside Supabase (GitHub Actions). On failure the job fails; GitHub emails the failure.

on:
  schedule:
    - cron: "17 6 */3 * *"   # every 3 days, 08:17 Israel (winter)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query the database through the REST API
        env:
          SB_URL: https://xghfcdgettrcdciwwzbl.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          [ -n "$SB_KEY" ] || { echo "::error::secret SUPABASE_ANON_KEY is missing"; exit 1; }
          ok=""
          for i in 1 2 3; do
            code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 60 \
              -X POST "$SB_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{}' || echo 000)
            body=$(head -c 300 body.txt 2>/dev/null)
            echo "attempt $i: HTTP $code, body: $body"
            if [ "$code" = "200" ] && { [ "$body" = "true" ]; }; then ok=1; break; fi
            sleep 30
          done
          if [ -z "$ok" ]; then
            echo "::error::Supabase project did not answer the database query (HTTP $code). It may be paused: open https://supabase.com/dashboard/project/xghfcdgettrcdciwwzbl and click Resume."
            exit 1
          fi
          echo "database answered: project is active"
